<!doctype html>
<html lang="[#instruction-language-tag]">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="[#sign-in-document-description]">
    <title>[#sign-in-document-title]</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/components/account-menu.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">[#sign-in-skip-label]</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="index.html" aria-label="[#sign-in-brand-home-label]">
          <img class="brand__mark" src="../../assets/icons/brand-mark.svg" alt="" width="37" height="37">
          <span>[#sign-in-brand-name]</span>
        </a>
        <!--#include file="../includes/account-menu.inc" -->
      </div>
    </header>

    <main id="main-content" class="page-shell page-shell--narrow">
      <p class="eyebrow">[#sign-in-eyebrow]</p>
      <h1>[#sign-in-sign-in-link]</h1>
      <p class="lede">[#sign-in-introduction]</p>

      <section class="surface form-card" aria-labelledby="identity-options-title">
        <h2 id="identity-options-title">[#sign-in-options-title]</h2>
        <ul class="provider-list">
          <li><button type="button" disabled aria-describedby="identity-help">[#sign-in-provider-label]</button></li>
          <li><button type="button" disabled aria-describedby="identity-help">[#sign-in-email-label]</button></li>
          <li><a class="button button--primary" href="chapter.html">[#sign-in-guest-label]</a></li>
        </ul>
        <p id="identity-help" class="field-help">[#sign-in-identity-help]</p>
      </section>

      <aside class="prototype-note" aria-label="[#sign-in-privacy-label]">
        <strong>[#sign-in-privacy-heading]</strong> [#sign-in-privacy-description]
      </aside>
    </main>
  </body>
</html>
