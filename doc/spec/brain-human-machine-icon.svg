      .fold{fill:none;stroke:#176b5b;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .circuit{fill:none;stroke:#176b5b;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .node{fill:#f3b642;stroke:#17332d;stroke-width:7}
    </style>
