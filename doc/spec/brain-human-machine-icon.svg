    <path id="brain-shape" d="M256 91C237 58 199 48 168 66C139 54 104 72 94 104C58 111 40 145 50 179C24 203 27 245 54 266C42 302 59 339 92 352C90 389 122 418 160 414C180 449 226 455 256 428C286 455 332 449 352 414C390 418 422 389 420 352C453 339 470 302 458 266C485 245 488 203 462 179C472 145 454 111 418 104C408 72 373 54 344 66C313 48 275 58 256 91Z"/>
