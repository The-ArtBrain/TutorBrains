<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Human and machine brain</title>
  <desc id="desc">A single brain-shaped icon with organic folds on the left and electronic circuits on the right.</desc>
