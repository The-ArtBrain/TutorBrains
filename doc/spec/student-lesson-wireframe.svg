<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="1510" viewBox="0 0 2860 1510" role="img" aria-labelledby="title desc">
  <title id="title">Responsive student lesson wireframe</title>
  <desc id="desc">Editable desktop, tablet, and mobile wireframes for one logical Telugu lesson Card with sibling task, help, and learner-response panels.</desc>
  <defs>
    <style>
      .canvas{fill:#eef2ef}.frame{fill:#fffdf8;stroke:#263b36;stroke-width:2}.ink{fill:#17332d}.muted{fill:#5e706b}.line{stroke:#b8c5c0;stroke-width:2}.soft{fill:#f0f5f2;stroke:#b8c5c0;stroke-width:2}.panel{fill:#fff;stroke:#90a39c;stroke-width:2}.primary{fill:#176b5b}.primaryText{fill:#fff}.accent{fill:#f3b642}.label{font:600 18px Inter,Arial,sans-serif;fill:#17332d}.body{font:400 22px Inter,Arial,sans-serif;fill:#17332d}.small{font:400 16px Inter,Arial,sans-serif;fill:#5e706b}.tiny{font:500 14px Inter,Arial,sans-serif;fill:#5e706b}.button{font:600 18px Inter,Arial,sans-serif}.telugu{font:700 72px "Noto Sans Telugu","Nirmala UI",sans-serif;fill:#17332d}.teluguM{font:700 56px "Noto Sans Telugu","Nirmala UI",sans-serif;fill:#17332d}.teluguS{font:700 46px "Noto Sans Telugu","Nirmala UI",sans-serif;fill:#17332d}.title{font:700 36px Inter,Arial,sans-serif;fill:#17332d}.frameName{font:700 22px Inter,Arial,sans-serif;fill:#17332d}.note{font:400 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#29453e}.active{fill:#176b5b}.inactive{fill:#d9e3df}
    </style>
  </defs>
  <rect class="canvas" width="2860" height="1510"/>
  <text class="title" x="40" y="52">Student lesson · responsive wireframe</text>
  <text class="small" x="40" y="82">One logical Card; task, help, and learner response are sibling presentation sections</text>

  <text class="frameName" x="40" y="118">Desktop · 1440 × 1024</text>
  <g id="lesson-desktop" transform="translate(40 140)" data-semantic="body">
    <rect class="frame" width="1440" height="1024" rx="12"/>
    <g data-semantic="header">
      <rect width="1440" height="82" rx="12" fill="#fffdf8"/>
      <circle class="soft" cx="46" cy="41" r="22"/><path d="M37 43c0-12 18-12 18 0M33 57c5-11 22-11 27 0" fill="none" stroke="#17332d" stroke-width="2.5"/>
      <text class="label" x="82" y="36">Chapter 01</text><text class="small" x="82" y="59">Lesson 1 · Greet someone</text>
      <g data-semantic="nav" aria-label="Lesson controls"><text class="label" x="1280" y="48">Exit</text></g>
      <line class="line" x1="0" y1="82" x2="1440" y2="82"/>
    </g>
    <g data-semantic="main" transform="translate(180 112)">
      <g id="desktop-logical-card" data-semantic="article" aria-label="Lesson Card">
        <g data-semantic="section" aria-label="Current task">
          <rect class="panel" width="1080" height="360" rx="20"/>
          <text class="small" x="32" y="40">Listen, then greet an elder or teacher.</text>
          <text class="telugu" x="540" y="146" text-anchor="middle">నమస్కారం</text>
          <text class="body" x="540" y="202" text-anchor="middle">Namaskāraṁ</text>
          <g data-semantic="button" transform="translate(430 238)"><rect class="primary" width="220" height="58" rx="29"/><path d="M472 256v22l20-11z" fill="#fff"/><text class="button primaryText" x="132" y="37">Play audio</text></g>
          <g data-semantic="button" transform="translate(270 318)"><text class="label" x="0" y="0">Meaning</text></g>
          <g data-semantic="button" transform="translate(470 318)"><text class="label" x="0" y="0">Say it slowly</text></g>
          <g data-semantic="button" transform="translate(710 318)"><text class="label" x="0" y="0">Show transliteration</text></g>
        </g>
        <g data-semantic="form" aria-label="Choose a response method" transform="translate(0 388)">
          <text class="label" x="0" y="24">How would you like to respond?</text>
          <g data-semantic="button" transform="translate(0 48)"><rect class="soft" width="250" height="70" rx="14"/><circle cx="34" cy="35" r="13" fill="none" stroke="#17332d" stroke-width="3"/><path d="M34 18v34M23 43c4 10 18 10 22 0" fill="none" stroke="#17332d" stroke-width="3"/><text class="button" x="65" y="43">Speak</text></g>
          <g data-semantic="button" transform="translate(275 48)"><rect class="soft" width="250" height="70" rx="14"/><path d="M28 48l22-22 8 8-22 22H28z" fill="none" stroke="#17332d" stroke-width="3"/><text class="button" x="65" y="43">Write</text></g>
          <g data-semantic="button" transform="translate(550 48)"><rect class="soft" width="250" height="70" rx="14"/><rect x="23" y="23" width="32" height="26" rx="3" fill="none" stroke="#17332d" stroke-width="3"/><text class="button" x="72" y="43">Type</text></g>
          <g data-semantic="button" transform="translate(825 48)"><rect class="soft" width="255" height="70" rx="14"/><path d="M27 48h31V24H27zM31 19h23" fill="none" stroke="#17332d" stroke-width="3"/><text class="button" x="72" y="43">Upload image</text></g>
        </g>
        <g data-semantic="section" aria-label="Learner response" transform="translate(0 542)">
          <rect class="panel" width="1080" height="180" rx="20"/>
          <text class="label" x="28" y="42">Your response</text><text class="small" x="28" y="72">No response added yet.</text>
          <rect x="28" y="94" width="1024" height="58" rx="12" fill="#f8faf8" stroke="#b8c5c0" stroke-dasharray="8 8" stroke-width="2"/>
          <text class="small" x="540" y="129" text-anchor="middle">The selected response surface appears here.</text>
        </g>
      </g>
    </g>
  </g>

  <text class="frameName" x="1530" y="118">Tablet · 834 × 1194</text>
  <g id="lesson-tablet" transform="translate(1530 140)" data-semantic="body">
    <rect class="frame" width="834" height="1194" rx="12"/>
    <g data-semantic="header"><circle class="soft" cx="38" cy="40" r="20"/><text class="label" x="72" y="35">Chapter 01</text><text class="small" x="72" y="58">Lesson 1</text><text class="label" x="746" y="48">Exit</text><line class="line" x1="0" y1="80" x2="834" y2="80"/></g>
    <g data-semantic="main" transform="translate(40 108)">
      <g data-semantic="article">
        <g data-semantic="section"><rect class="panel" width="754" height="400" rx="20"/><text class="small" x="28" y="42">Listen, then greet an elder or teacher.</text><text class="teluguM" x="377" y="148" text-anchor="middle">నమస్కారం</text><text class="body" x="377" y="194" text-anchor="middle">Namaskāraṁ</text><g transform="translate(267 228)"><rect class="primary" width="220" height="56" rx="28"/><text class="button primaryText" x="110" y="36" text-anchor="middle">▶  Play audio</text></g><rect class="soft" x="58" y="320" width="180" height="48" rx="12"/><text class="label" x="148" y="350" text-anchor="middle">Meaning</text><rect class="soft" x="287" y="320" width="180" height="48" rx="12"/><text class="label" x="377" y="350" text-anchor="middle">Slow audio</text><rect class="soft" x="516" y="320" width="180" height="48" rx="12"/><text class="label" x="606" y="350" text-anchor="middle">Transliteration</text></g>
        <g data-semantic="form" transform="translate(0 428)"><text class="label" x="0" y="24">Choose a response method</text><rect class="soft" x="0" y="48" width="173" height="62" rx="12"/><text class="button" x="86" y="87" text-anchor="middle">Speak</text><rect class="soft" x="194" y="48" width="173" height="62" rx="12"/><text class="button" x="280" y="87" text-anchor="middle">Write</text><rect class="soft" x="388" y="48" width="173" height="62" rx="12"/><text class="button" x="474" y="87" text-anchor="middle">Type</text><rect class="soft" x="582" y="48" width="172" height="62" rx="12"/><text class="button" x="668" y="87" text-anchor="middle">Upload</text></g>
        <g data-semantic="section" transform="translate(0 570)"><rect class="panel" width="754" height="240" rx="20"/><text class="label" x="28" y="44">Your response</text><rect x="28" y="76" width="698" height="130" rx="12" fill="#f8faf8" stroke="#b8c5c0" stroke-dasharray="8 8" stroke-width="2"/><text class="small" x="377" y="146" text-anchor="middle">Selected response surface</text></g>
      </g>
    </g>
  </g>

  <text class="frameName" x="2415" y="118">Mobile · 390 × 844</text>
  <g id="lesson-mobile" transform="translate(2415 140)" data-semantic="body">
    <rect class="frame" width="390" height="844" rx="22"/>
    <g data-semantic="header"><text class="label" x="18" y="32">Chapter 01 · Lesson 1</text><text class="small" x="325" y="32">Exit</text><line class="line" x1="0" y1="52" x2="390" y2="52"/></g>
    <g data-semantic="main" transform="translate(16 70)">
      <g data-semantic="article">
        <g data-semantic="section"><rect class="panel" width="358" height="332" rx="18"/><text class="small" x="18" y="34">Listen, then greet politely.</text><text class="teluguS" x="179" y="110" text-anchor="middle">నమస్కారం</text><text class="small" x="179" y="142" text-anchor="middle">Namaskāraṁ</text><g transform="translate(69 170)"><rect class="primary" width="220" height="52" rx="26"/><text class="button primaryText" x="110" y="33" text-anchor="middle">▶  Play audio</text></g><rect class="soft" x="18" y="250" width="98" height="48" rx="10"/><text class="small" x="67" y="280" text-anchor="middle">Meaning</text><rect class="soft" x="130" y="250" width="98" height="48" rx="10"/><text class="small" x="179" y="280" text-anchor="middle">Slow</text><rect class="soft" x="242" y="250" width="98" height="48" rx="10"/><text class="small" x="291" y="280" text-anchor="middle">Text help</text></g>
        <g data-semantic="form" transform="translate(0 352)"><text class="label" x="0" y="22">Respond</text><rect class="soft" x="0" y="40" width="80" height="54" rx="12"/><text class="small" x="40" y="73" text-anchor="middle">Speak</text><rect class="soft" x="92" y="40" width="80" height="54" rx="12"/><text class="small" x="132" y="73" text-anchor="middle">Write</text><rect class="soft" x="184" y="40" width="80" height="54" rx="12"/><text class="small" x="224" y="73" text-anchor="middle">Type</text><rect class="soft" x="276" y="40" width="82" height="54" rx="12"/><text class="small" x="317" y="73" text-anchor="middle">Upload</text></g>
        <g data-semantic="section" transform="translate(0 470)"><rect class="panel" width="358" height="200" rx="18"/><text class="label" x="18" y="38">Your response</text><rect x="18" y="60" width="322" height="112" rx="12" fill="#f8faf8" stroke="#b8c5c0" stroke-dasharray="7 7" stroke-width="2"/><text class="small" x="179" y="120" text-anchor="middle">Response surface</text></g>
      </g>
    </g>
  </g>

  <g transform="translate(40 1375)">
    <text class="label" x="0" y="0">Semantic implementation map</text>
    <text class="note" x="0" y="34">&lt;header&gt; + lesson &lt;nav&gt; · &lt;main&gt; &lt;article aria-labelledby="card-title"&gt; · sibling task/help/response &lt;section&gt; elements · response &lt;form&gt;</text>
    <text class="note" x="0" y="66">Visual panels are not child domain Cards. Mobile reorders sections vertically; the Card identity and available actions remain unchanged.</text>
  </g>
</svg>
